<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5797"/>
      <stop offset="1" stop-color="#1b3a66"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce6f2"/>
    </linearGradient>
  </defs>

  <!-- Rundes Kachel-Hintergrund -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>

  <!-- Umschlag (Quelle) -->
  <g transform="translate(34,104)">
    <rect x="0" y="0" width="128" height="90" rx="10" fill="#f4b400"/>
    <rect x="0" y="0" width="128" height="90" rx="10" fill="none" stroke="#c98f00" stroke-width="3"/>
    <!-- Umschlagklappe -->
    <path d="M4 8 L64 54 L124 8" fill="none" stroke="#c98f00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pfeil nach oben rechts zur Wolke -->
  <g transform="translate(150,70)" stroke="#8bd450" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-14 86 L44 28"/>
    <path d="M14 22 L48 24 L46 58"/>
  </g>

  <!-- Wolke (Microsoft 365 / Ziel) -->
  <g transform="translate(150,34)">
    <path fill="url(#cloud)" stroke="#9fb3cc" stroke-width="2"
      d="M24 44
         a22 22 0 0 1 2 -43
         a26 26 0 0 1 48 6
         a18 18 0 0 1 -4 37
